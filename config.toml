# 默认配置。任何一项都可以用环境变量覆盖（见 rre/config.py 的 ENV_OVERRIDES），
# 或者用 RRE_CONFIG=/path/to/other.toml 换一份配置文件。相对路径以仓库根目录为基准。

[paths]
data_dir = "data"              # sources.toml、下载的原始文件、passages.jsonl
work_dir = ".work"             # 向量缓存、Qdrant 本地文件、BM25 缓存（不入库）
goldset = "goldset/goldset.jsonl"
results_dir = "results/public"

[models]
embedder = "BAAI/bge-m3"
reranker = "BAAI/bge-reranker-v2-m3"
max_seq_length = 1024          # BGE-M3 编码窗口
reranker_max_length = 512
device = "auto"                # auto / mps / cuda / cpu
offline = true                 # true 时设 HF_HUB_OFFLINE=1，只用本机缓存
batch_size = 16

[qdrant]
# "local"     -> 本地文件模式，写在 {work_dir}/qdrant（不起服务）
# ":memory:"  -> 进程内内存模式（每次评测从向量缓存重新灌入）
# "http://host:6333" -> 连远程 Qdrant 服务
location = "local"
collection = "rre_bge_m3"

[chunk]
max_chars = 900                # 单段上限（字符）
min_chars = 20                 # 去空白后不足此数的段丢弃

[retrieval]
vector_candidates = 100        # 向量检索取前多少段
topn_each = 20                 # 融合时每一路取前多少段
rrf_k = 60
rerank_top = 20                # 精排池大小
